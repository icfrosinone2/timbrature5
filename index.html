    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Data e ora","Nome","Tipo","Plesso","Distanza (m)"],...a.map(p=>[new Date(pt(p)).toLocaleString("it-IT"),p.name,p.type,p.site,p.dist])]),"Timbrature");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([["Nome","Giorni","Ore"],...Object.values(byPerson(a)).map(x=>[x.name,days(x.l),+(worked(x.l,false)/3600000).toFixed(2)])]),"Ore mensili");
    XLSX.writeFile(wb,"timbrature-"+mon+".xlsx");
  }

  const ci=h("input",{placeholder:"Codice per i nuovi arrivati"}),cm=h("div",{class:"msg",style:"display:none"}),l2=h("div");
  P.s={n:h("div",{class:"card"},h("h2",{},"Persone"),h("p",{class:"mu"},"Codice di accesso per dipendenti e supplenti. Cambiandolo, i nuovi non potranno registrarsi con quello vecchio."),ci,
    h("button",{onclick:async()=>{if(ci.value.trim().length<4)return msg(cm,"Almeno 4 caratteri","ko");try{await setDoc(doc(db,"config","access"),{code:ci.value.trim()});msg(cm,"Codice salvato","ok")}catch(e){msg(cm,"Errore: "+e.code,"ko")}}},"Salva codice"),cm,hr(),l2),
    u(){if(document.activeElement!==ci)ci.value=code;l2.replaceChildren(...rows(S.staff.slice().sort((a,b)=>a.name.localeCompare(b.name)),s=>h("div",{class:"item"},h("div",{class:"av"},ini(s.name)),h("div",{class:"g"},h("b",{},s.name),s.active?null:h("div",{class:"mu"},"disattivato")),
      h("button",{class:"g",onclick:()=>updateDoc(doc(db,"staff",s.id),{active:!s.active})},s.active?"Disattiva":"Riattiva"))))}};
  function hr(){return h("hr")}

  const sn=h("input",{placeholder:"Nome plesso (es. Plesso Centro)"}),ri=h("input",{type:"number",min:"20",placeholder:"Raggio in metri"}),sm=h("div",{class:"msg",style:"display:none"}),l3=h("div");
  const saveCfg=(list,radius)=>setDoc(doc(db,"config","sites"),{list,radius}).catch(e=>msg(sm,"Errore: "+e.code,"ko"));
  P.d={n:h("div",{class:"card"},h("h2",{},"Plessi"),h("p",{class:"mu"},"Vai nel plesso, scrivi il nome e premi “Salva qui”: la posizione attuale diventa la sede."),sn,
    h("button",{onclick:async()=>{if(!sn.value.trim())return msg(sm,"Scrivi il nome","ko");if(cfg.list.length>=12)return msg(sm,"Troppi plessi","ko");
      try{const p=await pos();await saveCfg([...cfg.list,{n:sn.value.trim(),lat:p.latitude,lng:p.longitude}],cfg.radius);sn.value="";msg(sm,"Plesso salvato","ok")}catch(e){msg(sm,e.message,"ko")}}},"Salva qui"),
    h("p",{class:"mu"},"Raggio consentito (metri)"),ri,h("button",{class:"g",onclick:()=>saveCfg(cfg.list,Math.max(20,+ri.value||100))},"Salva raggio"),sm,hr(),l3),
    u(){if(document.activeElement!==ri)ri.value=cfg.radius;l3.replaceChildren(...rows(cfg.list,(s,i)=>h("div",{class:"item"},h("div",{class:"g"},(i+1)+". "+s.n),h("button",{class:"g",onclick:()=>saveCfg(cfg.list.filter((_,j)=>j!==i),cfg.radius)},"Elimina"))))}};

  const deny=()=>plain("Accesso negato",h("div",{class:"card"},"Questo account non è autorizzato come responsabile."),h("p",{class:"c"},h("button",{class:"g",onclick:()=>signOut(auth)},"Esci")));
  const sh=shell("Responsabile",h("button",{onclick:()=>signOut(auth)},"Esci"),[{k:"p",t:"Presenti",i:"check"},{k:"r",t:"Richieste",i:"cal"},{k:"t",t:"Timbrature",i:"list"},{k:"o",t:"Ore",i:"chart"},{k:"s",t:"Persone",i:"users"},{k:"d",t:"Plessi",i:"pin"}],P,"p");
  un.push(onSnapshot(collection(db,"staff"),s=>{S.staff=s.docs.map(d=>({id:d.id,...d.data()}));sh.upd()},deny));
  un.push(onSnapshot(query(collection(db,"requests"),orderBy("at","desc"),limit(200)),s=>{S.reqs=s.docs.map(d=>({id:d.id,...d.data()}));sh.upd()},deny));
  un.push(onSnapshot(doc(db,"config","sites"),d=>{if(d.exists())cfg={list:[],radius:100,...d.data()};sh.upd()},()=>{}));
  un.push(onSnapshot(doc(db,"config","access"),d=>{code=d.exists()?d.data().code:"";sh.upd()},()=>{}));
  subP();
}
